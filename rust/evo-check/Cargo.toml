[package]
name = "evo-check"
description = "The read-only diagnostics of tools/evo_check.cpp: Bluetooth, D-Bus, the IVI scene and the system, on aa-dbus"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "evo-check"
path = "src/main.rs"

[dependencies]
aa-dbus = { path = "../aa-dbus" }
evo-text = { path = "../evo-text" }

# posix_spawnp, poll, waitpid, signals and alarm, for the program on Linux; its output and filters build anywhere.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
