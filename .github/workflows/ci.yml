# Checks that need no copy of the car's system: style, repository content, PC tests, and the Rust ports' tests.
# The ARM build links against the car's libraries (BMW files), so it runs on a developer's machine, not here, and so do
# the Rust tests built for the head unit's ARM target (tools/verify_arm.py).
name: CI

# A push or pull request that changes documentation only (Markdown files and docs/) starts no run. NOTICE.md is not
# documentation here: verify_core.py reads it. tools/code_changes.py holds the same rule for the pre-push hook and
# publish_release.py, and the two must agree.
on:
  push:
    # release/x.y.z: a published version rebuilt from its own commit with a fix that does not touch what ships.
    branches: [main, "release/**"]
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "NOTICE.md"
  pull_request:
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "NOTICE.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: read # the job's image

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Style, content and PC tests
    runs-on: ubuntu-24.04
    # Debian 12 with the compilers, the style tools and the installer test's BusyBox: .github/ci/Dockerfile, built by
    # ci-image.yml. A change there gets a new tag, named here once it is pushed.
    container:
      image: ghcr.io/callmelewis/aa-entrynav-ci:1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # verify_repo.py reads every commit
      - name: Style
        run: make style STYLE_TOOLS=/opt/style/bin RUFF=/opt/style/bin/ruff
      - name: Content
        run: |
          git config --global --add safe.directory "$PWD"
          make verify_core verify_repo verify_tests verify_hmi_affinity
      - name: PC tests
        # One make target per test, so they build and run side by side: three per processor, since most of a test's
        # time is spent waiting.
        # The installer test needs a BusyBox that behaves like the car's; Debian's packages do not. The image holds the
        # one tests/build_busybox.sh builds.
        run: make -j"$(($(nproc) * 3))" --output-sync=target test-host HOST_CXX=g++ BUSYBOX=/opt/busybox/busybox

  rust:
    name: Rust tests, Clippy and rustfmt
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner's own rustup installs the version rust/rust-toolchain.toml pins, so no toolchain action is needed.
      - name: Install the pinned Rust, Clippy and rustfmt
        run: |
          rustup toolchain install --no-self-update
          rustup component add clippy rustfmt
      - name: Formatting
        run: cargo fmt --check
      - name: The tests of every crate, against the fixtures recorded from the C++
        run: cargo test --locked
      - name: Clippy on every crate and target, warnings as errors
        run: cargo clippy --locked --all-targets -- -D warnings

