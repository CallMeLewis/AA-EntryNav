# Checks that need no copy of the car's system: style, repository content, PC tests.
# The ARM build links against the car's libraries (BMW files), so it runs on a developer's machine, not here.
name: CI

on:
  push:
    # release/x.y.z: a published version rebuilt from its own commit with a fix that does not touch what ships.
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Style, content and PC tests
    runs-on: ubuntu-24.04
    container: debian:12
    timeout-minutes: 20
    steps:
      - name: Install the tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends bzip2 ca-certificates curl dbus g++ gcc git libdbus-1-dev \
            libssl-dev make pkg-config protobuf-compiler python3 python3-protobuf python3-venv shellcheck
          python3 -m venv /opt/style
          /opt/style/bin/pip install --quiet clang-format==18.1.8 ruff==0.6.9
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # verify_repo.py reads every commit
      - name: Style
        run: make style STYLE_TOOLS=/opt/style/bin RUFF=/opt/style/bin/ruff
      - name: Content
        run: |
          git config --global --add safe.directory "$PWD"
          make verify_core verify_repo verify_tests
      # The installer test needs a BusyBox that behaves like the car's; Debian's packages do not (tests/build_busybox.sh).
      # Building it takes about 20 seconds, so it is kept between runs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/aa-entrynav-busybox
          key: busybox-${{ hashFiles('tests/build_busybox.sh') }}
      - name: PC tests
        # One make target per test, so they build and run side by side: three per processor, since most of a test's
        # time is spent waiting.
        run: |
          BUSYBOX="$(sh tests/build_busybox.sh)"
          make -j"$(($(nproc) * 3))" --output-sync=target test-host HOST_CXX=g++ BUSYBOX="$BUSYBOX"

